# shelly-emu configuration. Copy to config.yaml and adjust.
#
# Home Assistant connection. Environment variables HA_URL, HA_TOKEN (or HA_TOKEN_FILE)
# override these keys; leaving the token out of this file is recommended.
homeassistant:
  url: http://homeassistant.local:8123
  # token: eyJhbGciOi...        # long-lived access token (Profile -> Security in HA)

# log_level: INFO               # or env LOG_LEVEL
# mdns_interfaces: [192.168.1.20]   # restrict the mDNS responder to these host addresses

devices:
  # A Shelly Pro 4PM: up to four Home Assistant switches as Sigen "smart loads".
  - model: pro4pm               # pro1pm | pro2pm | pro4pm | plus1pm | plus2pm | plusplugs | pro3em
    name: "Smart plugs"         # Shelly device name shown in mySigen
    mac: "AABBCCDDEEFF"         # 12 hex digits; fixes the Shelly id (shellypro4pm-aabbccddeeff). Pick any locally unique value.
    # bind: 0.0.0.0             # listen address (set per device when one container hosts several devices)
    # ip: 192.168.1.20          # address advertised via mDNS / reported as sta_ip; auto-detected
    # http_port: 80             # Sigen assumes 80, only change for local testing
    # mdns: true
    # modbus: false             # Modbus TCP server, default true for pro3em only
    # modbus_port: 502
    # timezone: Europe/Amsterdam
    # wifi_ssid: HomeAssistant  # cosmetic, reported by Wifi.GetStatus
    # firmware_version: "2.0.0" # mySigen rejects old versions
    # fw_id: "20260710-101218/2.0.0-g87fbfa4"
    channels:                   # 1..N entries, N = channels of the model
      - switch: switch.boiler   # any switch/light/input_boolean: its state is the Shelly output,
        name: Boiler            # Switch.Set from Sigen becomes switch.turn_on/off (or homeassistant.turn_on/off)
        power: sensor.boiler_power          # W   (optional; derived from voltage * current * pf if absent)
        energy: sensor.boiler_energy        # total energy (optional; integrated from power if absent)
        # energy_unit: kWh                  # kWh | Wh; default: the entity's unit_of_measurement, else kWh
        # voltage: sensor.boiler_voltage    # V   (optional)
        # current: sensor.boiler_current    # A   (optional, derived from P/V if absent; negative = export)
        # energy_returned: ...              # optional
        # frequency: ...                    # Hz
        # power_factor: ...
        # temperature: ...                  # degrees C
        # input: binary_sensor.boiler_door  # reported as input:N
      - switch: switch.dryer
        name: Dryer
        power: sensor.dryer_power
      - switch: switch.pool_pump
        name: Pool pump
        power: sensor.pool_pump_power
        energy: sensor.pool_pump_energy
      - switch: input_boolean.spare
        name: Spare

  # A second device in the same container only works when it has its own IP address
  # (bind: on a host with several addresses). Otherwise run one container per device
  # with macvlan, see docker-compose.macvlan.yml and README.
  #
  # - model: pro3em
  #   name: "Grid meter"
  #   mac: "AABBCCDDEE01"
  #   bind: 192.168.1.21
  #   output_addon:           # optional: Shelly Pro Output Add-on relay, exposed as switch:100.
  #     switch: switch.boiler #   Needed for "Metering & Control" in mySigen (decide before pairing,
  #     name: Boiler          #   the app cannot change it later without removing the device).
  #   em:
  #     energy_unit: kWh
  #     # neutral_current: sensor.p1_current_n
  #     # temperature: sensor.meter_temperature
  #     phases:                 # 1..3 entries (a, b, c); missing phases report 0 W
  #       - power: sensor.p1_power_l1      # W, negative = export (derived from voltage * current * pf if absent)
  #         voltage: sensor.p1_voltage_l1  # V (default 230)
  #         energy: sensor.p1_energy_import           # import counter
  #         energy_returned: sensor.p1_energy_export  # export counter
  #         # current / apparent_power / power_factor / frequency: optional, derived if absent (negative current = export)
  #       - power: sensor.p1_power_l2
  #         voltage: sensor.p1_voltage_l2
  #       - power: sensor.p1_power_l3
  #         voltage: sensor.p1_voltage_l3
